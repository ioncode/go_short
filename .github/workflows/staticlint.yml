name: Staticlint Check

on:
  pull_request:
    branches:
      - master

jobs:
  staticlint:
    name: Run custom multichecker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run staticlint unit tests
        run: go test -v ./cmd/staticlint

      - name: Build staticlint
        run: go build -o staticlint ./cmd/staticlint

      - name: Run staticlint on project
        run: ./staticlint ./...

      - name: Clean up binary
        if: always()
        run: rm -f staticlint
